appId: com.phuocng23000.sdchat
---
# Covers: Change Password rejects a confirmation that doesn't match, and the
# dialog's close button dismisses it without changing anything.
- launchApp
- assertVisible: "Chat.*"
- tapOn: "Settings"
- tapOn: "Change"
- assertVisible: "Change Password"
- tapOn: "New Password"
- inputText: "new-password-123"
- tapOn: "Confirm Password"
- inputText: "different-password-456"
- hideKeyboard
- tapOn: "Update"
- assertVisible: "Passwords do not match"
- tapOn: "OK"
- assertVisible: "Change Password"
- tapOn: "Cancel"
- assertNotVisible: "Change Password"
- assertNotVisible: "Password updated successfully"
