appId: com.phuocng23000.sdchat
---
# CI only: delete the account setup-account.yaml created, so runs don't pile
# up test users. Logs back in first in case a failed flow left the app
# signed out.
- launchApp
# Wait for whichever first screen appears before deciding whether to log in;
# checking straight after launch races the cold start.
- assertVisible: "Settings"
- scrollUntilVisible:
    element: { id: "delete-account-button" }
- assertVisible: { id: "delete-account-button" }
- tapOn: { id: "delete-account-button" }
- assertVisible: "Notification"
- tapOn: "Okay"
- extendedWaitUntil:
    visible: "Authentication"
    timeout: 20000
