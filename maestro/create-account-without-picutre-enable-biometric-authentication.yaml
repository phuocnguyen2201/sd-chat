appId: "com.phuocng23000.sdchat"
---
- extendedWaitUntil: 
    visible: "Authentication.*"
    timeout: 50000
# Register with a fresh mail.tm inbox, confirm the email, log in
- runFlow: subflows/new-inbox-register-and-confirm.yaml
- extendedWaitUntil:
    visible: "Input Field"
    timeout: 20000
- tapOn: "Input Field"
- inputRandomPersonName
- tapOn: "Save"
- assertVisible:
    point: 8%,12%
- tapOn: "Enable Touch ID"
- extendedWaitUntil:
    visible:
        point: 10%,41%
    timeout: 10000
- tapOn: "Allow"
- extendedWaitUntil:
    visible:
        point: 3%,14%
    timeout: 10000
