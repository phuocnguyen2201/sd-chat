appId: com.phuocng23000.sdchat
---
# Covers: long-press -> MessageAction edit-message-button -> input is pre-filled with the
# decrypted text -> send re-encrypts and UPDATEs the row (handleSend's
# activeMessage branch). Sends its own message first so it is self-contained.

- assertVisible: { id: "message-input" }
- tapOn: { id: "message-input" }
- inputText: "Message before edit"
- tapOn: { id: "send-button" }
- extendedWaitUntil:
    visible: "Message before edit"
    timeout: 10000

- longPressOn: "Message before edit"
- assertVisible: { id: "edit-message-button" }
- assertVisible: { id: "forward-message-button" }
- assertVisible: { id: "delete-message-button" }
- tapOn: { id: "edit-message-button" }

# onEdit() copies the decrypted text into the composer; clear it and retype
- tapOn: { id: "message-input" }
- eraseText: 40
- inputText: "Message after edit"
- tapOn: { id: "send-button" }
- assertVisible: ".*after.*"
- assertNotVisible: ".*before.*"
