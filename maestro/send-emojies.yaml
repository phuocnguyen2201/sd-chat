appId: com.phuocng23000.sdchat
---
- launchApp

- assertVisible: ".*Android Simulator.*"
- tapOn: ".*Android Simulator.*"
- assertVisible: "Android Simulator"
- assertVisible: { id: "message-input" }

# The picker renders emojis as text (Picker `native`), so search for one
# and tap it by its character instead of by screen position.
- tapOn: { id: "emoji-picker-button" }
- tapOn: "Search"
- inputText: "grimacing"
- tapOn: "😬"
- tapOn: { id: "send-button" }

# Sending closes the picker and clears the input, so the only 😬 left on
# screen is the sent message.
- extendedWaitUntil:
    visible: "😬"
    timeout: 10000
