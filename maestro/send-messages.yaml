appId: com.phuocng23000.sdchat
---
- launchApp
- extendedWaitUntil:
    visible: "Chat.*"
    timeout: 50000
- assertVisible: ".*Android Simulator.*"
- tapOn: ".*Android Simulator.*"
- assertVisible: "Android Simulator"
- assertVisible:
    point: 0%,92%
- assertVisible: "Input Field"
- assertVisible: "➤"
- tapOn: "Input Field"
- inputText: "Testing message"
- tapOn: "➤"
- assertVisible: "Testing message"
