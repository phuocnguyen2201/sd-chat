appId: com.phuocng23000.sdchat
---

- assertVisible: { id: "message-input" }
- assertVisible: { id: "picture-picker-button" }
- assertVisible: { id: "files-picker-button" }
- assertVisible: { id: "emoji-picker-button" }
- assertVisible: { id: "send-button" }
- assertVisible: { id: "edit-chat-room-button" }
- tapOn: { id: "edit-chat-room-button" }
- assertVisible: "Edit Chat Room"
- assertVisible: "Android Simulator"
- assertVisible:
    point: 39%,13%

# First tap is for Edit Screen, second tap to get back to Chat Screen
- tapOn: "Navigate up"
- tapOn: "Navigate up"