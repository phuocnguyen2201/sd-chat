appId: com.phuocng23000.sdchat
---

- tapOn: "Navigate up"
- extendedWaitUntil:
    visible: { id: "user-list" }
    timeout: 15000
- swipe:
    from:
        id: "user-list"
    direction: LEFT
- waitForAnimationToEnd
- swipe:
    from:
        id: "user-list"
    direction: RIGHT
- waitForAnimationToEnd

# Exact text inside the user strip: a regex also matches the chat row, and a
# half-hidden strip item can hand the tap to its neighbour.
- tapOn: "Android Simulator"
# Opening a DM from the strip is slow (key lookup before navigating).
- extendedWaitUntil:
    visible: { id: "message-input" }
    timeout: 20000

- assertVisible: { id: "picture-picker-button" }
- assertVisible: { id: "files-picker-button" }
- assertVisible: { id: "emoji-picker-button" }
- assertVisible: { id: "send-button" }
- assertVisible: { id: "edit-chat-room-button" }
- tapOn: { id: "edit-chat-room-button" }
- extendedWaitUntil:
    visible: "Edit Chat Room"
    timeout: 15000

- assertVisible:
    point: 39%,13%
# First tap is for Edit Screen, second tap to get back to Chat Screen
- tapOn: "Navigate up"
- tapOn: "Navigate up"
- extendedWaitUntil:
    visible: "Search Messenger"
    timeout: 15000
