appId: com.phuocng23000.sdchat
---


# Still inside a chat room from the previous flow? Go back to the Chat screen first.
- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - tapOn: "Navigate up"
      - extendedWaitUntil:
          visible: "Chat.*"
          timeout: 15000
      - assertVisible: "Android Simulator"
      - tapOn: "Android Simulator"
      - waitForAnimationToEnd
      - tapOn: "Navigate up"

- assertVisible: "Testing"
- tapOn: "Testing"
- assertVisible: "Testing"
- tapOn: { id: "message-input" }
- inputText: "Testing forward message"
- tapOn: { id: "send-button" }
- longPressOn: "Testing forward message"
- assertVisible:
    point: 6%,23%
- assertVisible: { id: "forward-message-button" }
- tapOn: { id: "forward-message-button" }
- assertVisible:
    point: 3%,67%
- assertVisible:
    point: 6%,79%
- assertVisible: "Android Simulator"
- waitForAnimationToEnd
- tapOn: "Android Simulator"

- assertVisible: { id: "confirm-forward-message-button" }
- tapOn: { id: "confirm-forward-message-button" }
- extendedWaitUntil:
    notVisible: { id: "confirm-forward-message-button" }
    timeout: 15000

# The forwarded copy must read as plain text in the recipient's chat, not as
# the sender room's ciphertext.
- tapOn: "Navigate up"
- extendedWaitUntil:
    visible: "Search Messenger"
    timeout: 15000
- tapOn: "Android Simulator"
- extendedWaitUntil:
    visible: { id: "message-input" }
    timeout: 20000
- extendedWaitUntil:
    visible: "Testing forward message"
    timeout: 10000

# Back to the "Testing" chat, where forward-cancel-then-send.yaml starts.
- tapOn: "Navigate up"
- extendedWaitUntil:
    visible: "Search Messenger"
    timeout: 15000
- tapOn: "Testing"
- extendedWaitUntil:
    visible: { id: "message-input" }
    timeout: 20000
