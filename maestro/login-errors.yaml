appId: com.phuocng23000.sdchat
---
# Inputs: the gluestack Input wrapper hides the TextInput's testID and (on iOS)
# its placeholder, so tap the field below its label instead.
# Covers: login and sign-up form validation and a rejected sign-in.
# The unconfirmed-email case lives in signup-unconfirmed.yaml.
#
# NOTE: starts with clearState, which wipes this device's copy of ${EMAIL}'s
# private key. Run recover-key-from-backup.yaml (after backup-key.yaml) next
# to put it back.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 50000

# Empty form
- tapOn: "Login"
- assertVisible: "Please enter both email and password"
- tapOn: { id: "accept-button" }
- tapOn: "Register"
- assertVisible: "Please enter both email and password"
- tapOn: { id: "accept-button" }

# Sign-up validation (runs before anything is sent). Filled inputs lose the
# placeholder text the flow taps on, so each case starts from a fresh screen.
- tapOn:
    text: "Input Field|Enter your email"
    below: "Email"
- inputText: "not-an-email"
- tapOn:
    text: "Input Field|Enter your password"
    below: "Password"
- inputText: "Long-enough-123!"
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn: { id: "register-button" }
- assertVisible: "Please enter a valid email address"
- tapOn: { id: "accept-button" }
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 50000

- tapOn:
    text: "Input Field|Enter your email"
    below: "Email"
- inputText: "someone@example.com"
- tapOn:
    text: "Input Field|Enter your password"
    below: "Password"
- inputText: "short"
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn: { id: "register-button" }
- assertVisible: "Password must be at least 8 characters"
- tapOn: { id: "accept-button" }
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 50000

- tapOn:
    text: "Input Field|Enter your email"
    below: "Email"
- inputText: "someone@example.com"
- tapOn:
    text: "Input Field|Enter your password"
    below: "Password"
- inputText: "alllowercase1"
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn: { id: "register-button" }
- assertVisible: "Password must include an uppercase letter, a symbol"
- tapOn: { id: "accept-button" }
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 50000

# Email only
- tapOn:
    text: "Input Field|Enter your email"
    below: "Email"
- inputText: ${EMAIL}
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn: "Login"
- assertVisible: "Please enter both email and password"
- tapOn: { id: "accept-button" }

# Wrong password
- tapOn:
    text: "Input Field|Enter your password"
    below: "Password"
- inputText: "wrong-password-123"
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn: "Login"
- extendedWaitUntil:
    visible: "Invalid login credentials"
    timeout: 15000
- tapOn: "Cancel"
- assertVisible: "Authentication.*"
- assertNotVisible: "Chat.*"
