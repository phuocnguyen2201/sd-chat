appId: com.phuocng23000.sdchat
---
# Covers: Settings -> Delete Account -> confirmation dialog -> Okay
# -> accountAPI.deleteAccount() -> router.replace('/') back to login.
#
# NOTE: this registers a throwaway account first. It must never run against
# the shared ${MAESTRO_EMAIL} fixture the other flows log in with.
- launchApp
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 50000
- assertVisible: "Email"
- assertVisible: "Password"

# Register with a fresh mail.tm inbox, confirm the email, log in
- runFlow: subflows/new-inbox-register-and-confirm.yaml

# Complete profile (display name only, no avatar)
- extendedWaitUntil:
    visible: "Complete the profile"
    timeout: 20000
- tapOn: "Input Field"
- inputRandomPersonName

- runFlow:
    when:
      platform: "iOS"
    commands:
      - assertVisible: ".*Return.*"
      - tapOn: ".*Return.*"

- tapOn: "Save"

# Skip the biometric enrolment step
- extendedWaitUntil:
    visible: "Enable Biometric"
    timeout: 15000
- tapOn: "Skip"

- extendedWaitUntil:
    visible: "Chat.*"
    timeout: 15000

# Settings -> Delete Account
- tapOn: "Settings"
- assertVisible: "Delete Account"
- tapOn: { id: "delete-account-button" }

- assertVisible: "Notification"
- assertVisible: "Delete the account cannot be undone.*"

# Cancel first — the account must survive
- tapOn: "Cancel"
- assertVisible: "Delete Account"

# Confirm for real
- tapOn: { id: "delete-account-button" }
- assertVisible: "Notification"
- tapOn: "Okay"

# deleteAccount() routes back to the login screen
- extendedWaitUntil:
    visible: "Authentication.*"
    timeout: 20000
- assertVisible: "Email"
- assertVisible: "Password"
