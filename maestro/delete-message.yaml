appId: com.phuocng23000.sdchat
---
# Covers: long-press -> MessageAction delete-message-button -> confirmation AlertDialog
# -> confirm-delete-message-button -> handleDeleteMessage(). Sends its own message first so it never
# destroys seeded fixtures the other flows assert on.

- assertVisible: { id: "message-input" }
- tapOn: { id: "message-input" }
- inputText: "Message to delete"
- tapOn: { id: "send-button" }
- extendedWaitUntil:
    visible: "Message to delete"
    timeout: 10000

- longPressOn: "Message to delete"
- assertVisible: { id: "delete-message-button" }
- tapOn: { id: "delete-message-button" }

# Confirmation dialog
- assertVisible: "Notification"
- assertVisible: "Delete the message cannot be undone.*"

# Cancel first — the message must survive
- tapOn: { id: "cancel-delete-message-button" }
- assertVisible: "Message to delete"

# Now confirm for real
- longPressOn: "Message to delete"
- tapOn: { id: "delete-message-button" }
- assertVisible: "Notification"
- tapOn: { id: "confirm-delete-message-button" }

- extendedWaitUntil:
    notVisible: "Message to delete"
    timeout: 15000
