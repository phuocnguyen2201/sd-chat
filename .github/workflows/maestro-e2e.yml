name: Maestro E2E (Android)

# The suite runs against the real Supabase project and creates, then deletes,
# a test account per run, so it doesn't run on every PR. Run it by hand from
# the Actions tab, or let it run on pushes to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'documentation/**'
      - 'sd-chat-vault/**'
      - 'confirm-page/**'
      - 'assets/**'
      - 'sd-chat-vault/**'
      - 'supabase/**'

concurrency:
  group: maestro-e2e-${{ github.ref }}
  cancel-in-progress: true

# Two jobs so a failed run can be resumed with "Re-run failed jobs":
# a build failure reruns from the build, a test failure reuses the APK
# uploaded by the successful build job and only reruns the tests.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # EXPO_PUBLIC_* values are inlined into the JS bundle at build time.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_PREPATH_STORAGE: storage/v1/object/sign
      EXPO_PUBLIC_SQLITE: snapshot
      EXPO_PUBLIC_NOTIFICATION_URL: https://exp.host/--/api/v2/push/send
      EXPO_PUBLIC_PAIRING_KEY_URL: ${{ secrets.EXPO_PUBLIC_PAIRING_KEY_URL }}
      EXPO_PUBLIC_VAULT_URL: ${{ secrets.EXPO_PUBLIC_VAULT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # google-services.json isn't committed; app.json points at it.
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}' | base64 -d > google-services.json

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Release build bundles the JS, so no Metro server is needed.
      # The generated project signs release with the debug keystore.
      - name: Build release APK (x86_64 only)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npx jest --watchAll=false --ci

  # Report only: numbers go to the job summary and the perf-results artifact.
  # Only a crash here blocks e2e; a slower number never does, since timings
  # on shared runners already move ~15% between runs of the same commit.
  # Details: documentation/testing/performance.md.
  perf:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crypto bench
        run: |
          mkdir -p perf-results
          BENCH_MARKDOWN=perf-results/crypto-bench.md npm run bench:crypto
          cat perf-results/crypto-bench.md >> "$GITHUB_STEP_SUMMARY"

      # Compared against the previous commit on this branch. Commits from
      # before perf/render existed have nothing to measure, hence the
      # continue-on-error; the report then lists every scenario as added.
      - name: Reassure baseline (previous commit)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          git switch --detach "$base"
          npm ci
          npx reassure --baseline

      - name: Reassure current
        run: |
          git switch --detach ${{ github.sha }}
          npm ci
          npx reassure --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}
          cat .reassure/output.md >> "$GITHUB_STEP_SUMMARY"

      # The APK that e2e installs, so no second build is needed.
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: apk

      - name: Bundle size
        run: |
          apk_bytes=$(stat -c %s apk/app-release.apk)
          bundle_bytes=$(unzip -l apk/app-release.apk assets/index.android.bundle | awk '/index.android.bundle/ {print $1}')
          {
            echo "## Bundle size"
            echo "| | MB |"
            echo "|---|---|"
            echo "| APK (x86_64) | $(awk "BEGIN {printf \"%.2f\", $apk_bytes/1048576}") |"
            echo "| JS bundle (Hermes bytecode) | $(awk "BEGIN {printf \"%.2f\", ${bundle_bytes:-0}/1048576}") |"
          } | tee -a "$GITHUB_STEP_SUMMARY" perf-results/bundle-size.md

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf-results/
            .reassure/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: [build, unit-test, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Used by run-maestro.sh for the FPS/CPU/RAM pass before the suite.
      - name: Install Flashlight
        run: |
          curl -Ls "https://get.flashlight.dev" | bash
          echo "$HOME/.flashlight/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        # The account's email is a mail.tm inbox made by run-maestro.sh, so the
        # sign-up confirmation email can be read (example.com would bounce).
        env:
          PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          # Must be the publishable key (sb_publishable_...), same as the app build.
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/app-release.apk
            bash .github/scripts/run-maestro.sh

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-results/
          if-no-files-found: ignore
